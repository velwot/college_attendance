<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
  <title>Insights · DIV-O Attendance</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#68738a;--line:#e3e8f1;--blue:#2563eb;--green:#087443;--amber:#a65a00;--red:#b4233c;--shadow:0 10px 28px rgba(28,42,70,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7f9fd,#eef4ff);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:28px 18px 42px}h1{font-size:1.55rem;letter-spacing:-.035em;margin:0}p{color:var(--muted)}.nav{display:flex;gap:7px;overflow:auto;margin:12px 0 22px}.nav a{color:#506079;text-decoration:none;white-space:nowrap;padding:7px 10px;border-radius:8px;font-size:.8rem;font-weight:750}.nav a:hover,.nav a[aria-current=page]{color:var(--blue);background:#eaf1ff}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.metric,.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:17px}.metric{padding:16px}.metric b{display:block;font-size:1.55rem;letter-spacing:-.04em}.metric span{font-size:.76rem;color:var(--muted)}.card{padding:19px;margin-bottom:16px}.card h2{font-size:1.02rem;margin:0 0 5px}.subject{display:grid;grid-template-columns:100px 1fr 58px;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.subject:last-child{border:0}.name{font-weight:780}.bar{height:9px;background:#e8eef8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f8bff,#2563eb);border-radius:99px}.value{text-align:right;font-size:.8rem;font-weight:780}.sub{font-size:.76rem;color:var(--muted)}.activity{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:13px}.day{min-height:61px;border-radius:10px;background:#edf1f7;padding:7px;font-size:.68rem;color:var(--muted)}.day.active{background:#d9f4e5;color:var(--green);font-weight:800}.day b{display:block;font-size:.85rem;color:inherit;margin-top:4px}.empty{padding:20px;text-align:center;border:1px dashed #cbd7e6;border-radius:12px;color:var(--muted)}@media(max-width:560px){.app{padding:20px 14px 30px}.metrics{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:span 2}.card{padding:15px}.subject{grid-template-columns:80px 1fr 50px}.activity{gap:5px}.day{min-height:55px;padding:5px;font-size:.61rem}}
  </style>
</head>
<body><main class="app">
  <h1>Attendance insights</h1><p>Marked classes only — unmarked and future classes are never treated as absences.</p>
  <nav class="nav" aria-label="Application pages"><a href="index.html">Dashboard</a><a href="insights.html" aria-current="page">Insights</a><a href="save.html">Save &amp; Backup</a></nav>
  <section id="metrics" class="metrics"></section>
  <section class="card"><h2>Subject performance</h2><p class="sub">Present ÷ (Present + Absent)</p><div id="subjects"></div></section>
  <section class="card"><h2>Last 7 days of marked activity</h2><p class="sub">This is a record of marks made, not scheduled classes.</p><div id="activity" class="activity"></div></section>
</main>
<script>
  const state=JSON.parse(localStorage.getItem("divOAttendance") || '{"attendance":{}}');
  const attendance=state.attendance || {}; const entries=Object.entries(attendance).map(([id,status])=>{const part=id.split("|");return {date:part[0],subject:part[4] || "Unknown",status};});
  const present=entries.filter(x=>x.status==="present").length, absent=entries.filter(x=>x.status==="absent").length, rate=entries.length ? present / entries.length * 100 : 0;
  document.getElementById("metrics").innerHTML=[[rate.toFixed(1)+"%","Overall attendance"],[present,"Present marks"],[absent,"Absent marks"]].map(([value,label])=>`<div class="metric"><b>${value}</b><span>${label}</span></div>`).join("");
  const bySubject={}; entries.forEach(x=>{const s=bySubject[x.subject] ||= {present:0,total:0};s.total++;if(x.status==="present")s.present++;});
  const target=Number(state.target) || 75;
  const rows=Object.entries(bySubject).sort(([a],[b])=>a.localeCompare(b)); document.getElementById("subjects").innerHTML=rows.length ? rows.map(([name,x])=>{const pct=x.present/x.total*100;const bunk=Math.max(0,Math.floor((x.present*100/target)-x.total+1e-9));const need=Math.max(0,Math.ceil((target*x.total-100*x.present)/(100-target)));const forecast=pct>=target ? `Can miss ${bunk} more at ${target}% target` : `Attend ${need} in a row to reach ${target}%`;return `<div class="subject"><span class="name">${name}</span><div><div class="bar"><i style="width:${pct}%"></i></div><span class="sub">${x.present} present of ${x.total} marked · ${forecast}</span></div><span class="value">${pct.toFixed(1)}%</span></div>`}).join("") : '<div class="empty">No marked attendance yet. Mark a class on the Dashboard to begin seeing insights.</div>';
  const dates=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().slice(0,10)});document.getElementById("activity").innerHTML=dates.map(date=>{const count=entries.filter(x=>x.date===date).length;return `<div class="day ${count?"active":""}">${new Date(date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short"})}<b>${count || "—"}</b></div>`}).join("");
</script></body></html>
